[workspace]
resolver = "2"
members = ["crates/prism-core", "crates/prism-wasm"]
default-members = ["crates/prism-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Unlicense"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.prism-wasm]
opt-level = "s"
